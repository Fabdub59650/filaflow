<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="version" content="1.0.0">
  <meta name="theme-color" content="#141517">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FilaFlow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilaFlow</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/apps-nav.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>

<div id="app">
  <header id="app-header">
    <a href="#" class="brand" data-tab="filaments" aria-label="FilaFlow, accueil">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-name">FilaFlow</span>
    </a>
    <nav class="header-nav" aria-label="Navigation principale">
      <a href="#" class="nav-item active" data-tab="filaments">Filaments</a>
      <a href="#" class="nav-item" data-tab="stats">Stats</a>
      <a href="#" class="nav-item" data-tab="spoolweights">Bobines réf.</a>
      <a href="#" class="nav-item" data-tab="settings">Paramètres</a>
      <a href="#" class="nav-item" data-tab="history">Historique</a>
    </nav>
    <div class="header-end">
      <button type="button" id="pwa-install-btn" class="icon-btn" onclick="installPWA()" style="display:none"
              title="Installer l'application" aria-label="Installer l'application">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v13M5 9l7 7 7-7"/><rect x="3" y="18" width="18" height="3" rx="1"/></svg>
      </button>
      <!-- Toggle thème -->
      <button id="theme-toggle-btn" class="icon-btn" onclick="toggleDarkMode()" title="Basculer thème clair/sombre" aria-label="Basculer clair/sombre"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path></svg></button>
      <!-- Barre d'applis FilaFlow · PrepFlow · ModelFlow (js/apps-nav.js, fichier commun aux trois dépôts) -->
      <span id="apps-nav" style="flex-shrink:0"></span>
      <span id="sys-version" class="version"></span>
    </div>
  </header>

  <main id="main">
    <div id="topbar">
      <div id="page-title" style="flex:1">Filaments</div>
      <div id="topbar-actions"></div>
    </div>
    <div id="content"></div>
  </main>
  <footer id="statusbar" aria-label="État du matériel">
    <button type="button" id="nfc-sidebar-badge" class="spoolman-status offline" onclick="openNfcScanModal()" title="Lecteur NFC : scanner une bobine">
      <span class="status-dot" aria-hidden="true"></span><span class="status-label">NFC</span><span class="status-sub" id="nfc-sidebar-sub">Recherche…</span>
    </button>
    <div id="scale-sidebar-badge" class="spoolman-status offline" title="Balance connectée">
      <span class="status-dot" aria-hidden="true"></span><span class="status-label">Balance</span><span class="status-sub" id="scale-sidebar-sub">—</span>
    </div>
  </footer>
</div>


<div id="modal-overlay" class="hidden" onclick="closeModal()"></div>
<div id="modal" class="modal hidden"></div>
<div id="modal2-overlay" class="hidden" onclick="closeModal2()" style="z-index:1001"></div>
<div id="modal2" class="modal hidden" style="z-index:1002"></div>
<div id="toast-container"></div>

<!-- Actions rapides mobile (écran Filaments) -->
<div class="mobile-actions" id="mobile-actions">
  <button type="button" class="btn" onclick="openNfcScanModal()">Lecteur NFC</button>
  <button type="button" class="btn btn-primary" onclick="openWeighingModal()">Pesée</button>
</div>

<script>
// Intercepteur d'erreurs global pour diagnostic
window.onerror = function(msg, src, line, col, err) {
  var div = document.getElementById('js-error-banner');
  if (!div) {
    div = document.createElement('div');
    div.id = 'js-error-banner';
    div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;font-family:monospace;z-index:99999;white-space:pre-wrap;max-height:200px;overflow-y:auto';
    document.body.appendChild(div);
  }
  div.textContent += (src ? src.split('/').pop() : '?') + ':' + line + ' — ' + msg + '\n';
  return false;
};
</script>
<script src="/js/api.js"></script>
<script src="/js/nfc.js"></script>
<script src="/js/components.js"></script>
<script src="/js/tabs/filaments.js"></script>
<script src="/js/tabs/inventory.js"></script>
<script src="/js/tabs/spoolweights.js"></script>
<script src="/js/tabs/settings.js"></script>
        <script src="/js/label-editor.js"></script>
    <script src="/js/tabs/history.js"></script>
    <script src="/js/tabs/stats.js"></script>
<script src="/js/app.js"></script>
  <script>
  // ── Service Worker ────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    // Recharger une seule fois quand une nouvelle version du service worker
    // prend la main (transition depuis une ancienne version en cache).
    const hadController = !!navigator.serviceWorker.controller;
    let reloadedForSW = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!hadController || reloadedForSW) return;
      reloadedForSW = true;
      window.location.reload();
    });
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then(function(reg) { reg.update().catch(function(){}); })
        .catch(function(e)  { console.warn('[PWA] SW erreur', e); });
    });
  }

  // ── Bouton d'installation PWA ─────────────────────────────
  let _pwaInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _pwaInstallPrompt = e;
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.style.display = 'flex';
  });

  window.addEventListener('appinstalled', function() {
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.style.display = 'none';
    _pwaInstallPrompt = null;
  });

  function installPWA() {
    if (!_pwaInstallPrompt) return;
    _pwaInstallPrompt.prompt();
    _pwaInstallPrompt.userChoice.then(function(result) {
      _pwaInstallPrompt = null;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
    });
  }
  </script>
</body>
</html>
