<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="version" content="1.0.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FilaFlow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilaFlow</title>
<link rel="stylesheet" href="/css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo-mark"></div>
      <div>
        <div class="logo-name">FilaFlow</div>
        <div class="logo-sub">Stock filament</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-tab="filaments">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3"/><path d="M10 3v4M10 13v4M3 10h4M13 10h4"/></svg>
        Filaments
      </a>
      <a href="#" class="nav-item" data-tab="spoolweights">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M10 3v14M3 10h14"/><circle cx="10" cy="10" r="2" fill="currentColor"/></svg>
        Bobines réf.
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item" data-tab="settings">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="2.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>
        Paramètres
      </a>
      <a href="#" class="nav-item" data-tab="history">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><path d="M10 6v4l3 3"/></svg>
        Historique
      </a>
    </nav>
    <div id="pwa-install-btn"
         onclick="installPWA()"
         style="display:none;align-items:center;gap:7px;padding:10px 16px;
                border-top:0.5px solid var(--border);font-size:12px;
                color:var(--accent);cursor:pointer;transition:background 0.15s"
         onmouseover="this.style.background='var(--bg3)'"
         onmouseout="this.style.background=''">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2v13M5 9l7 7 7-7"/><rect x="3" y="18" width="18" height="3" rx="1"/>
      </svg>
      Installer l'application
    </div>
    <div id="nfc-sidebar-badge" class="spoolman-status offline">
      <span class="status-dot"></span>
      <span class="status-label">NFC</span>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <!-- Hamburger mobile/tablette -->
      <button id="hamburger-btn" style="display:none" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <div id="page-title" style="flex:1">Filaments</div>
      <div id="topbar-actions"></div>
      <!-- Toggle thème -->
      <button id="theme-toggle-btn" onclick="toggleDarkMode()" title="Basculer thème clair/sombre"
        style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;
               border-radius:50%;border:0.5px solid var(--border2);background:var(--bg3);
               cursor:pointer;font-size:16px;flex-shrink:0;transition:background 0.15s">🌙</button>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- Overlay sidebar mobile -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="modal-overlay" class="hidden" onclick="closeModal()"></div>
<div id="modal" class="modal hidden"></div>
<div id="modal2-overlay" class="hidden" onclick="closeModal2()" style="z-index:1001"></div>
<div id="modal2" class="modal hidden" style="z-index:1002"></div>
<div id="toast-container"></div>

<script>
// Intercepteur d'erreurs global pour diagnostic
window.onerror = function(msg, src, line, col, err) {
  var div = document.getElementById('js-error-banner');
  if (!div) {
    div = document.createElement('div');
    div.id = 'js-error-banner';
    div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;font-family:monospace;z-index:99999;white-space:pre-wrap;max-height:200px;overflow-y:auto';
    document.body.appendChild(div);
  }
  div.textContent += (src ? src.split('/').pop() : '?') + ':' + line + ' — ' + msg + '\n';
  return false;
};
</script>
<script src="/js/api.js"></script>
<script src="/js/nfc.js"></script>
<script src="/js/components.js"></script>
<script src="/js/tabs/filaments.js"></script>
<script src="/js/tabs/spoolweights.js"></script>
<script src="/js/tabs/settings.js"></script>
        <script src="/js/label-editor.js"></script>
    <script src="/js/tabs/history.js"></script>
<script src="/js/app.js"></script>
  <script>
  // ── Service Worker ────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js')
        .then(function(reg) { console.log('[PWA] SW enregistré', reg.scope); })
        .catch(function(e)  { console.warn('[PWA] SW erreur', e); });
    });
  }

  // ── Bouton d'installation PWA ─────────────────────────────
  let _pwaInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _pwaInstallPrompt = e;
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.style.display = 'flex';
  });

  window.addEventListener('appinstalled', function() {
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.style.display = 'none';
    _pwaInstallPrompt = null;
  });

  function installPWA() {
    if (!_pwaInstallPrompt) return;
    _pwaInstallPrompt.prompt();
    _pwaInstallPrompt.userChoice.then(function(result) {
      _pwaInstallPrompt = null;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
    });
  }
  </script>
</body>
</html>
